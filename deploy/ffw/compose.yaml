name: cosmos-ffw
services:
  companion:
    image: ${ROBOTIS_IMAGE:-robotis/ai-worker:2.2.8}
    pull_policy: never
    # Bypass the image's inherited s6/bringup entrypoint: start this companion only.
    entrypoint: ["/bin/bash", "/opt/cosmos_ffw/run.sh"]
    working_dir: /opt/cosmos_ffw
    healthcheck:
      disable: true
    container_name: cosmos-ffw-companion
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    stop_grace_period: 3s
    pids_limit: 128
    mem_limit: 512m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    environment:
      PYTHONPATH: /opt/cosmos_ffw
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-30}
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ROS_LOG_DIR: /tmp/cosmos-ros-logs
      ZENOH_CONFIG_OVERRIDE: 'mode="client";connect/endpoints=["tcp/127.0.0.1:7447"];scouting/multicast/enabled=false;transport/shared_memory/enabled=false'
    volumes:
      - type: bind
        source: ./cosmos_ffw
        target: /opt/cosmos_ffw/cosmos_ffw
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./run.sh
        target: /opt/cosmos_ffw/run.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FFW_PROFILE:-./config/profile.reference.json}
        target: /config/profile.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FFW_INITIAL_POSITIONS:-/home/robotis/ai_worker/ffw_bringup/config/ffw_bg2_rev4_follower/ffw_bg2_follower_initial_positions.yaml}
        target: /config/initial_positions.yaml
        read_only: true
        bind:
          create_host_path: false
    command: ["--profile", "/config/profile.json", "--initial-positions", "/config/initial_positions.yaml", "--mode", "${COSMOS_MODE:-preview}"]
