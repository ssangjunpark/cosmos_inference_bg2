name: cosmos-gateway
services:
  gateway:
    build: .
    image: cosmos-bg2-gateway:local
    container_name: cosmos-bg2-gateway
    network_mode: host
    user: "${COSMOS_UID:-1000}:${COSMOS_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    stop_grace_period: 12s
    pids_limit: 128
    mem_limit: 1g
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    volumes:
      - type: bind
        source: ${COSMOS_PROFILE:-./config/profile.reference.json}
        target: /config/profile.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COSMOS_TOKEN_FILE:-./inference.token}
        target: /config/inference.token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /output
        bind:
          create_host_path: false
    command: ["${COSMOS_MODE:-preview}", "--profile", "/config/profile.json", "--messages-dir", "/opt/cosmos_gateway/messages", "--token-file", "/config/inference.token", "--server-url", "http://127.0.0.1:8008", "--instruction", "${COSMOS_INSTRUCTION:-}", "--output", "/output/${COSMOS_RUN_ID:-preview-001}"]
